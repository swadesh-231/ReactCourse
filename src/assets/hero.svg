<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Sticker card: hard offset shadow + crayon outline -->
  <rect x="65" y="87" width="290" height="250" rx="32" fill="#2c2a3a" />
  <rect x="55" y="75" width="290" height="250" rx="32" fill="#ffffff" stroke="#2c2a3a" stroke-width="4" />

  <!-- React atom orbits -->
  <g stroke="#6b4eff" stroke-width="7" fill="none" stroke-linecap="round">
    <g transform="rotate(0 200 195)">
      <ellipse cx="200" cy="195" rx="100" ry="38" />
      <circle cx="300" cy="195" r="9" fill="#7fc4ff" stroke="#2c2a3a" stroke-width="3" />
    </g>
    <g transform="rotate(60 200 195)">
      <ellipse cx="200" cy="195" rx="100" ry="38" />
      <circle cx="300" cy="195" r="9" fill="#ff9dc4" stroke="#2c2a3a" stroke-width="3" />
    </g>
    <g transform="rotate(120 200 195)">
      <ellipse cx="200" cy="195" rx="100" ry="38" />
      <circle cx="300" cy="195" r="9" fill="#8be3a8" stroke="#2c2a3a" stroke-width="3" />
    </g>
  </g>

  <!-- Nucleus -->
  <circle cx="200" cy="195" r="17" fill="#ffd45c" stroke="#2c2a3a" stroke-width="4" />
  <circle cx="194" cy="189" r="4" fill="#ffffff" opacity="0.8" />

  <!-- Crayon sparkles -->
  <g stroke="#2c2a3a" stroke-width="3" stroke-linejoin="round">
    <polygon points="100,100 104.2,110.8 115,115 104.2,119.2 100,130 95.8,119.2 85,115 95.8,110.8" fill="#ffd45c" />
    <polygon points="305,107 308.64,116.36 318,120 308.64,123.64 305,133 301.36,123.64 292,120 301.36,116.36" fill="#ff9dc4" />
    <polygon points="108,286 111.36,294.64 120,298 111.36,301.36 108,310 104.64,301.36 96,298 104.64,294.64" fill="#7fc4ff" />
    <polygon points="298,290 300.8,297.2 308,300 300.8,302.8 298,310 295.2,302.8 288,300 295.2,297.2" fill="#8be3a8" />
  </g>
</svg>
